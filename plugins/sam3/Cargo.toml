[package]
name = "sam3-select"
version = "0.1.0"
edition = "2024"
description = "Native Rust + CUDA SAM 3.1 selection helper for PhotoCraft"

[dependencies]
candle-core = { version = "0.11", features = ["cuda"] }
candle-nn = { version = "0.11", features = ["cuda"] }
memmap2 = "0.9"
safetensors = "0.8"
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
