[package]
name = "lama-cleaner"
version = "0.1.0"
edition = "2024"
description = "Native Rust LaMa (Large Mask Inpainting) Cleaner plugin"

[dependencies]
# Windows x86_64 has exactly one CUDA prebuilt (`cuda13,tensorrt,nvrtx,directml`),
# so `cuda` alone never matches the distribution table: `lax-feature-matching`
# selects that build, and `preload-dylibs` lets the helper load CUDA/cuDNN from a
# folder of our choosing instead of depending on PATH.
ort = { version = "2.0.0-rc.9", features = ["cuda", "directml", "preload-dylibs", "lax-feature-matching"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace]
